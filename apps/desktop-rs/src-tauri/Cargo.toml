[package]
name = "anchor-desktop"
version = "0.1.0"
description = "Anchor 锚点 — 本地优先的 Windows 桌面 ADHD 陪伴应用 (Tauri 2)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "anchor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
# M1：原生 Win32 追踪，替代 Electron 版的 koffi FFI
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_SystemInformation", # GetTickCount（空闲计算）
  "Win32_UI_Accessibility",      # SetWinEventHook / HWINEVENTHOOK
  "Win32_UI_WindowsAndMessaging", # GetForegroundWindow / GetWindowTextW / EVENT_SYSTEM_FOREGROUND
  "Win32_UI_Input_KeyboardAndMouse", # GetLastInputInfo（空闲检测）
  "Win32_Graphics_Gdi",           # MonitorFromWindow（主屏判定）
  "Win32_UI_Shell",               # 进程可执行文件解析兜底
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
