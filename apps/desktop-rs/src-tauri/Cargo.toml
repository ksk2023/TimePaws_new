[package]
name = "timepaws"
version = "0.1.0"
description = "TimePaws — 本地优先的 Windows 桌面 ADHD 陪伴应用 (Tauri 2)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "timepaws_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
# M1：原生 Win32 追踪，替代 Electron 版的 koffi FFI
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_SystemInformation", # GetTickCount（空闲计算）
  "Win32_UI_Accessibility",      # SetWinEventHook / HWINEVENTHOOK
  "Win32_UI_WindowsAndMessaging", # GetForegroundWindow / GetWindowTextW / EVENT_SYSTEM_FOREGROUND
  "Win32_UI_Input_KeyboardAndMouse", # GetLastInputInfo（空闲检测）
  "Win32_Graphics_Gdi",           # MonitorFromWindow（主屏判定）
  "Win32_UI_Shell",               # 进程可执行文件解析兜底
  "Win32_System_Registry",        # 开机自启（HKCU Run 键）
] }

[profile.release]
panic = "abort"
# 迭代期用 thin LTO + 多 codegen 并行（体积/速度接近 fat LTO，编译快数倍）
# 正式发布前可切回 lto = true / codegen-units = 1 做最终体积优化
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true
